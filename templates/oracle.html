<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tropisole — Oracle d'isolation</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/oracle.css') }}">
</head>
<body>

<header>
  <div>
    <div class="logo">TROPISOLE</div>
    <div class="logo-sub">Oracle d'isolation</div>
  </div>
  <span class="oracle-badge">🔮 Oracle</span>
  <a href="/oracle/ranking" title="Classement d'isolation" style="margin-left:.5rem;text-decoration:none;font-family:'Geist Mono',monospace;font-size:.75rem;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:.34rem .7rem">📊 Classement</a>
  <select onchange="if(this.value)location.href='/set-lang/'+this.value" title="Langue" style="margin-left:.5rem;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:.34rem .6rem;font-family:inherit;font-size:.8rem;cursor:pointer;outline:none">{% for l in languages %}<option value="{{ l.code }}"{{ ' selected' if l.code == lang }}>{{ l.label }}</option>{% endfor %}</select>
</header>

<main>

  <div class="search-section">
    <div class="search-title">🔮 Oracle d'isolation</div>
    <div class="search-sub">
      Choisis un Pokémon. L'oracle analyse toutes les combinaisons de biomes et de filtres<br>
      pour trouver où il est le plus facilement isolable de ses concurrents.
    </div>

    <div class="search-row">
      <div class="search-input-wrap">
        <input type="text" id="poke-input" placeholder="Rechercher un Pokémon…" autocomplete="off" />
        <div class="autocomplete-list" id="ac-list"></div>
      </div>
      <button class="btn-focus" id="btn-focus" onclick="toggleFocus()">
        🎯 Chaîne
      </button>
      <button class="btn-analyze" id="btn-analyze" disabled onclick="analyze()">
        Analyser →
      </button>
    </div>
    <div class="focus-hint" id="focus-hint">Mode chaîne : optimise pour toute la lignée évolutive</div>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>Analyse en cours…</span>
    </div>
  </div>

  <div class="results-section" id="results-section" style="display:none"></div>

</main>

<script>
const POKEMON_LIST = [
  {% for p in pokemon_list %}
  { numero: {{ p.numero }}, name: {{ p.name | tojson }}, forme: {{ p.forme | tojson }} },
  {% endfor %}
];
</script>
<script src="{{ url_for('static', filename='js/oracle.js') }}"></script>
</body>
</html>

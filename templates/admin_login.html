<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tropisole — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_login.css') }}">
</head>
<body>
<header>
  <div>
    <div class="logo-title">TROPISOLE</div>
    <div class="logo-sub">Administration</div>
  </div>
</header>
<main>
  <div class="card">
    <div class="card-title">🔐 Accès administrateur</div>
    <form method="POST" action="/admin">
      <div style="display:flex;flex-direction:column;gap:1.2rem;">
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <div class="field">
          <label for="password">Mot de passe admin</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autofocus />
        </div>
        <button type="submit" class="btn">Accéder</button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
